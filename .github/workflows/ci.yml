name: CI

# AUDIT FIX (#91): this repository previously had NO CI at all — a broken
# lint/type-check/build could be merged and deployed unchecked. This workflow
# runs on every push/PR:
#   npm ci (lockfile integrity, audit #100) -> type-check (lint) -> build
#   -> credential-repair tests against the real production bundle.
# Node version matches package.json "engines" (>=20 <23) and the Dockerfile
# base image (node:22).

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # If package-lock.json is committed, use reproducible `npm ci`.
      # If not present in git yet, gracefully fall back to `npm install`.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --include=dev
          else
            npm install --include=dev
          fi

      # tsc --noEmit over BOTH projects: client (tsconfig.json) and server
      # (tsconfig.server.json — audit #93: server files are now type-checked).
      - name: Type-check (lint)
        run: npm run lint

      - name: Build (vite + esbuild server bundle)
        run: npm run build

      # Exercises dist/server.cjs in library mode against temp DB roots.
      - name: Run test suite
        run: npm test

  nginx-config-syntax:
    # AUDIT FIX (#85): gate the deploy config with `nginx -t` so commented-out
    # or missing ssl_certificate directives can never silently ship a 443
    # server block that nginx refuses to load.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate nginx config syntax
        run: |
          sudo apt-get update && sudo apt-get install -y nginx openssl
          sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
          sudo cp deploy/nginx-azmajahanbin.conf /etc/nginx/sites-available/azmajahanbin.ir
          sudo ln -sf /etc/nginx/sites-available/azmajahanbin.ir /etc/nginx/sites-enabled/
          # Self-signed placeholder certs ONLY so `nginx -t` can resolve the
          # ssl_certificate paths; real deployments use certbot (see file header).
          sudo mkdir -p /etc/letsencrypt/live/azmajahanbin.ir
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /etc/letsencrypt/live/azmajahanbin.ir/privkey.pem \
            -out /etc/letsencrypt/live/azmajahanbin.ir/fullchain.pem \
            -subj "/CN=ci-placeholder"
          sudo nginx -t
