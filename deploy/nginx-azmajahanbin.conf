# Nginx reverse-proxy config for azmajahanbin.ir
# ---------------------------------------------------------------------------
# AUDIT FIX (#85): TLS setup is REQUIRED before this file can load — nginx
# refuses to start a `listen 443 ssl` server without an ssl_certificate.
# Provision real certs FIRST, then validate and reload:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d azmajahanbin.ir -d www.azmajahanbin.ir
#   sudo nginx -t && sudo systemctl reload nginx
# (certbot rewrites the ssl_certificate lines below automatically.)
#
# Place at /etc/nginx/sites-available/azmajahanbin.ir and symlink into sites-enabled.
#
# AUDIT FIX (#82/#84): The Node app (PM2) listens on 127.0.0.1:3000 — the SAME
# canonical port used by .env.example, ecosystem.config.cjs and the server.ts
# default (the old 5000 here silently disagreed with the app's 3000 default and
# produced site-wide 502s when the PM2 env override was missing). The app also
# serves the built frontend itself from the project-root dist/ directory via
# express.static (vite build output; there is NO dist/client subfolder), so
# nginx never touches static files directly — it only proxies.

upstream lab_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name azmajahanbin.ir www.azmajahanbin.ir;

    # Redirect everything to HTTPS (after certbot --nginx runs, this is kept)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name azmajahanbin.ir www.azmajahanbin.ir;

    # AUDIT FIX (#85): these MUST point at real certs before `nginx -t` passes.
    # Run certbot (see header of this file) or drop the files in place manually;
    # until then this 443 server block will not load and HSTS/CSP over TLS have
    # no effect. Paths kept as explicit placeholders so an operator can never
    # mistake a commented-out line for "already configured".
    ssl_certificate     /etc/letsencrypt/live/azmajahanbin.ir/fullchain.pem; # managed by certbot
    ssl_certificate_key /etc/letsencrypt/live/azmajahanbin.ir/privkey.pem;   # managed by certbot

    # Security headers.
    # NOTE: CSP + HSTS are enforced by the Node app itself
    # (server/securityHeaders.ts, applied to every HTML/document response).
    # They are intentionally NOT duplicated here — nginx `add_header` inside a
    # location block REPLACES all inherited headers, which previously caused the
    # security headers to silently disappear from static-asset responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # FIX (audit B9/B10): keep edge body limit in lockstep with Express
    # (`MAX_BODY_SIZE`, default 5mb) so oversized payloads get one clean 413
    # instead of a truncated stream / mismatched error surface.
    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # SSE endpoint must NOT be buffered and needs a long read timeout
    location /api/lab-data/events {
        proxy_pass http://lab_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    # API -> Node app
    # AUDIT FIX (#86): the blanket `Upgrade $http_upgrade / Connection "upgrade"`
    # pair was wrong here — this app has NO WebSocket endpoint (live updates use
    # SSE at /api/lab-data/events, handled by the dedicated block above). Forcing
    # "upgrade" on every /api request broke HTTP keep-alive to the upstream and
    # duplicated connection headers. Plain proxied requests now send an empty
    # Connection header (correct for HTTP/1.1 upstreams with keepalive); if a
    # WebSocket is ever added, give it its OWN location block with the upgrade
    # headers instead of re-adding them here.
    location /api {
        proxy_pass http://lab_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static assets: long cache for hashed Vite output
    location /assets/ {
        proxy_pass http://lab_app;
        proxy_set_header Host $host;
        expires 1y;
        # SECURITY FIX (audit #7): nginx `add_header` in a location block does
        # NOT merge with server-level add_headers — it REPLACES the inherited
        # set. The Cache-Control line below therefore silently dropped
        # X-Content-Type-Options / Referrer-Policy / Permissions-Policy from
        # every JS/CSS response (the exact incident documented near the top of
        # this file, re-introduced here). Re-declare them alongside.
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # FIX (audit B18): index.html must NEVER be cached — a stale shell pins
    # clients to an old hashed bundle after every deploy (white-screen risk).
    location = /index.html {
        proxy_pass http://lab_app;
        proxy_set_header Host $host;
        # Same audit #7 rule as /assets/: without repeating them here, the
        # location-level Cache-Control would strip the security headers from
        # the document response (Node's CSP still applies, but nosniff etc.
        # would vanish when this location is active).
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Everything else -> Node app (which serves the project-root dist/ build
    # output + SPA fallback — see AUDIT FIX #84 in this file's header)
    location / {
        proxy_pass http://lab_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
